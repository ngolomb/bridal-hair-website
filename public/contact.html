  <body>
<header class="site-header">
  <a href="/" class="logo" aria-label="Hair by Nechama home">Hair by Nechama</a>
 
  <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="mainNav">Menu</button>

     <main class="contact-page">
    <h1>Let’s plan your wedding hair</h1>
    <p class="contact-intro">Choose what you’d like to book, fill in your details, and your message will open in WhatsApp ready to send.</p>
 
    <form class="booking-form" action="/contact" method="post">
 
      <!-- the two big buttons: clicking one selects it -->
      <div class="choice-buttons">
        <label class="choice-btn">
          <input type="radio" name="bookingType" value="a trial" required>
          <span class="choice-title">Book a trial</span>
        </label>
 
        <label class="choice-btn">
          <input type="radio" name="bookingType" value="my wedding date">
          <span class="choice-title">Reserve your date</span>
        </label>
      </div>
 
      <div class="form-field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" autocomplete="name"
               required minlength="2"
               title="Please enter your name (at least 2 letters)">
      </div>
 
      <div class="form-field">
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" name="phone" autocomplete="tel"
               placeholder="07123 456789"
               required pattern="[0-9 +]{10,16}"
               title="Numbers only, at least 10 digits, for example 07123 456789">
      </div>
 
      <div class="form-field">
        <label for="date">Trial date / wedding date</label>
        <input type="date" id="date" name="date" required>
      </div>
 
      <button type="submit" class="btn btn-gold submit-btn">Submit</button>
    </form>
  </main>
        
    <footer>
     <footer class="site-footer">
    <p>Bridal hairstyling across Johannesburg</p>
    <p class="small">&copy; Hair by Nechama</p>
      </div>
    </footer>
