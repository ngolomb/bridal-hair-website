 <!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Hair by Nechama</title>
    <meta
      name="description"
      content="Hair for the day you will look back at forever"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    //external stylesheet
    <link rel="stylesheet" href="styles.css" />
 </head>
  <body>
 <header>
      <div class="container nav">
        <a href="#top" class="brand" aria-label="Hair by Nechama home">Hair by <span>Nechama</span></a>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="#about">About</a>
          <a href="#pricing">Pricing</a>
          <a href="#gallery">Gallery</a>
          <a href="#contact">Contact</a>
        </nav>
        <a class="button primary" href="#contact">Book Now</a>
      </div>
    </header>
    <main>
        <section class="contact-options">
        <div class="container contact-grid">
          <div class="contact-card calendar-card">
            <h2>Reserve your date</h2>
            <label for="trial-date">Select your trial date</label>
            <input id="trial-date" type="date" name="trial-date" /> 
            <label for="wedding-date">Select your wedding date</label>
            <input id="wedding-date" type="date" name="wedding-date" />

            <div class="booking-actions">
              <a
                class="button primary"
                href="https://wa.me/27721234567?text=Hi%20Hair%20by%20Nechama%2C%20I%27d%20like%20to%20reserve%20my%20wedding%20date."
                target="_blank"
                rel="noreferrer"
                >Reserve your wedding date</a
              >
              <a class="button secondary" href="sms:+27789833453?body=Hi%20Hair%20by%20Nechama%2C%20I%27d%20like%20to%20reserve%20my%20wedding%20date." >Text us</a>
              <a class="button ghost" href="mailto:hello@hairbynechama.co.za?subject=Wedding%20Date%20Enquiry">Email us</a>
            </div>
          </div>

          <div class="contact-card form-card">
            <h2>Book your bridal consultation</h2>
            <form class="contact-form" action="#" method="post">
              <label for="full-name">Full name</label>
              <input
                id="full-name"
                name="full-name"
                type="text"
                placeholder="Enter your full name"
                required
              />

              <label for="phone-number">Phone number</label>
              <input
                id="phone-number"
                name="phone-number"
                type="tel"
                placeholder="Enter your phone number"
                required
              />

              <label for="email-address">Email address</label>
              <input
                id="email-address"
                name="email-address"
                type="email"
                placeholder="Enter your email address"
                required
              />

              <label for="date-of-birth">Date of birth</label>
              <input
                id="date-of-birth"
                name="date-of-birth"
                type="date"
                required
              />

              <label for="trial-date-form">Trial date</label>
              <input id="trial-date-form" type="date" name="trial-date-form" />

              <label for="wedding-date-form">Wedding date</label>
              <input id="wedding-date-form" type="date" name="wedding-date-form" />

              <button type="submit" class="button primary">Submit booking enquiry</button>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div class="container footer-inner">
        <div class="footer-brand">Hair by Nechama</div>
         <p class="logo">Hair by Nechama; Gold</p>
    <p>Bridal hairstyling across Johannesburg</p>
    <p class="small">&copy; Hair by Nechama; Gold Bridal Hair</p>
      </div>
    </footer>
  </body>
</html>
